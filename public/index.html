<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>CODE SPRINT — Login</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="/">CODE<span>/</span>SPRINT</a>
      <div class="statusline">
        <span class="badge" id="status-badge">—</span>
        <button class="btn btn-sm" id="theme-btn" type="button">Theme</button>
      </div>
    </div>
  </header>

  <main class="login-wrap">
    <h1 class="login-title">CODE<span>/</span>SPRINT</h1>
    <p class="muted">One-day coding competition platform. Accounts are provisioned by the organizer — there is no public registration.</p>

    <div class="tabs" role="tablist" aria-label="Login type">
      <button type="button" id="tab-team" class="active" aria-pressed="true">Team Login</button>
      <button type="button" id="tab-judge" aria-pressed="false">Judge / Admin</button>
    </div>

    <form id="login-form">
      <label for="username">Team ID / Username</label>
      <input id="username" name="username" autocomplete="username" required style="margin-top:2px">
      <label for="password">Password</label>
      <div class="pw-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="pw-toggle" id="pw-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <div style="margin-top:20px">
        <button class="btn btn-primary" type="submit" id="login-submit" style="width:100%;padding:11px">Sign In</button>
      </div>
      <p id="login-error" class="small" style="font-weight:600;min-height:20px;color:var(--danger)" role="alert"></p>
    </form>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let mode = 'team';

    $('tab-team').onclick = () => switchTab('team');
    $('tab-judge').onclick = () => switchTab('judge');
    function switchTab(m) {
      mode = m;
      $('tab-team').classList.toggle('active', m === 'team');
      $('tab-judge').classList.toggle('active', m !== 'team');
      $('tab-team').setAttribute('aria-pressed', m === 'team');
      $('tab-judge').setAttribute('aria-pressed', m !== 'team');
      $('username').placeholder = m === 'team' ? 'team01' : 'judge';
      $('username').focus();
    }

    // Password visibility toggle (never changes the submitted value)
    $('pw-toggle').onclick = () => {
      const visible = $('password').type === 'text';
      $('password').type = visible ? 'password' : 'text';
      $('pw-toggle').textContent = visible ? 'Show' : 'Hide';
      $('pw-toggle').setAttribute('aria-pressed', String(!visible));
      $('pw-toggle').setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
      $('password').focus();
    };

    $('theme-btn').onclick = () => csToggleTheme();

    // Competition status badge (public API, no auth)
    async function refreshStatus() {
      try {
        const s = await csApi('/api/status');
        const b = $('status-badge');
        b.textContent = s.phaseLabel;
        b.className = 'badge' + (s.phase.startsWith('round') ? ' badge-live' : '');
      } catch { /* offline */ }
    }
    refreshStatus();
    setInterval(refreshStatus, 30000);
    if (window.io) {
      const socket = io();
      socket.on('phase', (p) => {
        const b = $('status-badge');
        b.textContent = p.phaseLabel;
        b.className = 'badge' + (p.phase.startsWith('round') ? ' badge-live' : '');
      });
    }

    let submitting = false;
    $('login-form').onsubmit = async (e) => {
      e.preventDefault();
      if (submitting) return;
      $('login-error').textContent = '';
      const btn = $('login-submit');
      submitting = true;
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const r = await csApi('/api/login', { method: 'POST', body: { username: $('username').value.trim(), password: $('password').value } });
        window.location.href = r.redirect;
      } catch (err) {
        $('login-error').textContent = err.message;
      } finally {
        submitting = false;
        if (document.body.contains(btn)) {
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      }
    };
  </script>
</body>
</html>
